name: Android CI

# Runs the ix35 app and its shared dependencies only. Sample apps are not
# part of the ix35 deliverable and are intentionally excluded from CI builds.
# Source-only: no signing secrets and no runtime authentication assets are
# provisioned here (see docs/RELEASE_SIGNING.md and SECURITY.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up the Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager is not on PATH in a plain bash step; resolve it from
          # the SDK the runner image ships (setup-android@v3 is avoided:
          # it still requests the removed "tools" package).
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Exact toolchain from docs/BUILD.md (NDK r25c is required for
          # the API 19 native build).
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "ndk;25.2.9519653"

      - name: Run shared tests, mobile lint and ix35 debug build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest \
            :mobile:lintDebug :mobile:assembleDebug

      - name: Upload ix35 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ix35-mobile-debug-apk-run-${{ github.run_number }}
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
